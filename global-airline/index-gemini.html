<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Airlines | Fly Everywhere</title>
    <link rel="stylesheet" href="./index-gemini.css">
    <!-- Font Awesome for Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>

    <!-- HEADER SECTION ----->
    <header>
        <div class="container nav-wrapper">
            <!-- Logo generated via CSS/Text for the top-left -->
            <div class="logo">
                <span class="logo-icon">G</span>
                <span class="logo-text">GLOBAL <span class="red-text">AIRLINES</span></span>
            </div>
            
            <nav>
                <ul>
                    <li><a href="#">Book</a></li>
                    <li><a href="#">Manage</a></li>
                    <li><a href="#">Check-in</a></li>
                    <li><a href="#">Flight Status</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>To Every Destination on Earth</h1>
                <p>Experience world-class service with Global Airlines.</p>
                
                <!-- SEARCH WIDGET (Delta-inspired functionality) -->
                <div class="booking-widget">
                    <div class="widget-tabs">
                        <button class="active">Book a Flight</button>
                        <button>My Trips</button>
                    </div>
                    <form class="booking-form">
                        <div class="input-group">
                            <label>From</label>
                            <input type="text" placeholder="Origin City">
                        </div>
                        <div class="input-group">
                            <label>To</label>
                            <input type="text" placeholder="Destination">
                        </div>
                        <div class="input-group">
                            <label>Dates</label>
                            <input type="date">
                        </div>
                        <button type="submit" class="btn-search">Find Flights</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER SECTION -->
    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h4>Global Airlines</h4>
                <p>© 2026 Global Airlines. All rights reserved.</p>
            </div>
            <div class="footer-section">
                <h4>Legal</h4>
                <ul>
                    <li><a href="#">Cookies Policy</a></li>
                    <li><a href="#">Privacy Notice</a></li>
                    <li><a href="#">Terms of Use</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Connect With Us</h4>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
